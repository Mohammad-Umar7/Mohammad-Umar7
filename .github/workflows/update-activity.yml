name: Update recent activity

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-activity.yml"

permissions:
  contents: write

jobs:
  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Render recent activity into README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, urllib.request

          user = os.environ["GH_USER"]

          def api(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "User-Agent": "profile-activity",
              })
              return json.load(urllib.request.urlopen(req))

          events = api(f"https://api.github.com/users/{user}/events/public?per_page=100")

          lines, seen = [], set()

          def repo_link(e):
              n = e["repo"]["name"]
              return f"[{n}](https://github.com/{n})"

          # GitHub trims event payloads (no html_url, merged or commit list), so links
          # are built from the repo name and number instead of read from the payload.
          def item_link(e, kind, item):
              url = item.get("html_url") or f"https://github.com/{e['repo']['name']}/{kind}/{item['number']}"
              return f"[#{item['number']}]({url})"

          def is_merged(pr):
              if "merged" in pr:
                  return pr["merged"]
              try:
                  return api(pr["url"]).get("merged", False)
              except Exception:
                  return False

          def describe(e):
              t = e["type"]; p = e.get("payload") or {}
              if t == "PushEvent":
                  n = len(p.get("commits") or [])
                  if n:
                      return f"⬆️ Pushed {n} commit{'s' if n > 1 else ''} to {repo_link(e)}"
                  return f"⬆️ Pushed to {repo_link(e)}"
              if t == "CreateEvent" and p.get("ref_type") == "repository":
                  return f"🎉 Created new repository {repo_link(e)}"
              if t == "WatchEvent":
                  return f"⭐ Starred {repo_link(e)}"
              if t == "ForkEvent":
                  return f"🍴 Forked {repo_link(e)}"
              if t == "ReleaseEvent" and p.get("action") == "published":
                  return f"🚀 Published release {p['release']['tag_name']} in {repo_link(e)}"
              if t == "IssuesEvent" and p.get("action") in ("opened", "closed"):
                  emoji = "❗️" if p["action"] == "opened" else "✅"
                  return f"{emoji} {p['action'].capitalize()} issue {item_link(e, 'issues', p['issue'])} in {repo_link(e)}"
              if t == "PullRequestEvent" and p.get("action") in ("opened", "closed"):
                  pr = p["pull_request"]
                  if p["action"] == "opened":
                      emoji, verb = "💪", "Opened"
                  elif is_merged(pr):
                      emoji, verb = "🎯", "Merged"
                  else:
                      emoji, verb = "🗑", "Closed"
                  return f"{emoji} {verb} PR {item_link(e, 'pull', pr)} in {repo_link(e)}"
              if t == "IssueCommentEvent" and p.get("action") == "created":
                  return f"🗣 Commented on {item_link(e, 'issues', p['issue'])} in {repo_link(e)}"
              if t == "PublicEvent":
                  return f"🔓 Made {repo_link(e)} public"

          for e in events:
              try:
                  line = describe(e)
              except (KeyError, TypeError):
                  # Skip an event with an unexpected payload rather than failing the whole run
                  continue
              if line and line not in seen:
                  seen.add(line); lines.append(line)
              if len(lines) >= 8:
                  break

          body = "\n".join(f"{i+1}. {l}" for i, l in enumerate(lines)) or "_Quiet week — building in private._"
          readme = open("README.md", encoding="utf-8").read()
          new = re.sub(
              r"(<!--START_SECTION:activity-->)(.*?)(<!--END_SECTION:activity-->)",
              lambda m: m.group(1) + "\n" + body + "\n" + m.group(3),
              readme, flags=re.S)
          open("README.md", "w", encoding="utf-8", newline="\n").write(new)
          print(body)
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || { git commit -m "chore: update recent activity"; git push; }
